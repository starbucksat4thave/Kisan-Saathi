services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: kisan_saathi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kisan_saathi"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/workspace/backend
      - ./config:/workspace/config
      - ./seed:/workspace/seed
    working_dir: /workspace/backend
    ports: ["8000:8000"]
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: python -m app.worker
    volumes:
      - ./backend:/workspace/backend
      - ./config:/workspace/config
      - ./seed:/workspace/seed
    working_dir: /workspace/backend
    depends_on:
      redis:
        condition: service_healthy

  dashboard:
    image: node:20-alpine
    command: sh -c "cd /workspace/dashboard && npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./:/workspace
    ports: ["5173:5173"]
